<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Management — Lab 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Управление складом (Store App)</h1>
            <p>Lab 5: DOM API, Event Delegation & Form Validation</p>
        </header>

        <section class="card">
            <h2>Добавить новый товар</h2>
            <form id="productForm" novalidate>
                <div class="form-group">
                    <label for="productName">Название товара:</label>
                    <input type="text" id="productName" placeholder="например, Ноутбук">
                    <span class="error-msg" id="nameError"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="productPrice">Цена (₸ / $):</label>
                        <input type="number" id="productPrice" placeholder="например, 1500" step="0.01">
                        <span class="error-msg" id="priceError"></span>
                    </div>

                    <div class="form-group">
                        <label for="productQty">Количество:</label>
                        <input type="number" id="productQty" placeholder="например, 5">
                        <span class="error-msg" id="qtyError"></span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Добавить в каталог</button>
            </form>
        </section>
        <section class="card">
            <div class="list-header">
                <h2>Список товаров</h2>
                <div class="total-badge">
                    Общая стоимость: <span id="grandTotal">0</span>
                </div>
            </div>

            <table class="product-table">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Цена</th>
                        <th>Количество</th>
                        <th>Итого</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="productList">

                </tbody>
            </table>
            <div id="emptyListMsg" class="empty-msg">Список товаров пуст.</div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
